<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulation runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* Results page written by `python -m nba_proj simulate`; the data replaces the DATA slot below.
   Dark analytics layout: a game slate strip, an injury bar with plays / sits switches, one dense
   table with points, rebounds and assists side by side (projection and run average highlighted),
   and a drilldown for the selected player. Works offline as a local file. */
:root {
  color-scheme: dark;
  --bg: #0D0E12; --panel: #121419; --panel-2: #181B22; --line: #1F2937; --line-soft: #181D26;
  --ink: #E6E8EC; --ink-2: #A3ABB8; --muted: #6E7683;
  --accent: #FF5A1F; --accent-soft: rgba(255, 90, 31, .13);
  /* chart marks, checked for contrast and colour-blind separation on the panel colour */
  --proj: #E6E8EC; --avg: #F5531A; --run: #4F94EE; --at: #0FA877; --below: #EF4444;
  --bar: #3A4250;
  --avg-ink: #FF7A45; --up: #10B981; --down: #F87171; --warn: #F5B544;
  --proj-band: rgba(230, 232, 236, .05); --avg-band: rgba(255, 90, 31, .10);
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Mono", "SF Mono", Consolas, ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
button { font: inherit; color: inherit; }
.app { max-width: 1640px; margin: 0 auto; padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -.01em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px;
  padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .mark { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); align-self: center; }
.brand h1 { font-size: 18px; }
.brand .sub { color: var(--ink-2); font-size: 14px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12.5px; }
.meta b { color: var(--ink-2); font-weight: 600; }

/* slate strip */
.slate { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.gchip { flex: 0 0 auto; min-width: 150px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; text-align: left; cursor: pointer; display: grid; gap: 3px; }
.gchip:hover { background: var(--panel-2); }
.gchip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.gchip .m { font-weight: 700; font-size: 15px; letter-spacing: .01em; }
.gchip .s { color: var(--muted); font-size: 12px; display: flex; gap: 8px; }
.gchip .flag { color: var(--warn); }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.ph { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px;
  padding: 10px 14px; border-bottom: 1px solid var(--line); }
.ph h2 { font-size: 15px; }
.ph .aside { color: var(--muted); font-size: 12.5px; }

/* injury bar */
.inj { padding: 10px 14px 12px; display: grid; gap: 10px; }
.inj-list { display: flex; flex-wrap: wrap; gap: 8px; }
.inj-item { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 6px 6px 10px; }
.inj-item .who { display: grid; line-height: 1.25; min-width: 0; flex: 1 1 auto; }
.inj-item .seg { flex: 0 0 auto; }
.inj-item .who b { font-weight: 600; }
.inj-item .who span { color: var(--muted); font-size: 12px; }
.inj-item.sitting { border-color: rgba(239, 68, 68, .55); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--bg); }
.seg button { background: none; border: 0; padding: 6px 11px; min-height: 32px; cursor: pointer; color: var(--ink-2);
  font-size: 12.5px; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg.small button { padding: 4px 9px; min-height: 28px; }
.out-line { color: var(--ink-2); font-size: 12.5px; }
.out-line .lbl { color: var(--muted); margin-right: 6px; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; font-weight: 600; }
.linkbtn { background: none; border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
.linkbtn:hover { color: var(--ink); border-color: var(--muted); }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.ctl { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12.5px; }
.ctl .val { min-width: 2.5ch; color: var(--ink); }
input[type=range] { accent-color: var(--accent); }
.step { width: 32px; height: 32px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel);
  cursor: pointer; font-size: 16px; line-height: 1; }
.step:hover { background: var(--panel-2); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; margin-left: auto; }
.key { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; border-radius: 1px; }

/* split */
.split { display: grid; grid-template-columns: minmax(0, 1.85fr) minmax(360px, 1fr); gap: 12px; align-items: start; }
@media (max-width: 1199px) { .split { grid-template-columns: minmax(0, 1fr); } }
.drill { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; scrollbar-width: thin; }
@media (max-width: 1199px) { .drill { position: static; max-height: none; } }

/* table */
.tscroll { overflow-x: auto; scrollbar-width: thin; }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.t th, .t td { padding: 6px 8px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; text-align: right; }
.t thead th { color: var(--muted); font-weight: 600; font-size: 11.5px; letter-spacing: .04em; background: var(--panel); }
.t thead tr.grp th { text-align: center; color: var(--ink-2); font-size: 11px; letter-spacing: .1em; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.t .gs { border-left: 1px solid var(--line); }
.t thead tr.grp th[rowspan] { vertical-align: bottom; text-align: right; color: var(--muted); font-size: 11.5px; letter-spacing: .04em; }
.t thead tr.grp th.c-name { text-align: left; }
.t th.c-proj, .t td.c-proj { background: var(--proj-band); }
.t th.c-avg, .t td.c-avg { background: var(--avg-band); }
.t th.c-proj { color: var(--ink); }
.t th.c-avg { color: var(--avg-ink); }
.t td.c-proj { color: var(--proj); font-weight: 650; font-size: 13.5px; }
.t td.c-avg { color: var(--avg-ink); font-weight: 700; font-size: 13.5px; }
.t td.rng { color: var(--ink-2); }
.t td.run { color: var(--run); font-weight: 600; }
.t td.fin { color: var(--ink); }
.t .c-name { position: sticky; left: 0; z-index: 1; background: var(--panel); text-align: left; min-width: 190px; max-width: 240px; white-space: normal; }
.t thead .c-name { z-index: 2; }
.t tbody tr { cursor: pointer; }
.t tbody tr:hover td { box-shadow: inset 0 0 0 9999px rgba(255, 255, 255, .03); }
.t tbody tr.sel td { box-shadow: inset 0 0 0 9999px rgba(79, 148, 238, .09); }
.t tbody tr.sel td.c-name { box-shadow: inset 3px 0 0 var(--accent), inset 0 0 0 9999px rgba(79, 148, 238, .09); }
.t tbody tr.out td { color: var(--muted); }
.sortbtn { all: unset; cursor: pointer; display: inline-flex; gap: 3px; align-items: center; }
.sortbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
th[aria-sort="descending"] .sortbtn::after { content: "▼"; font-size: 8px; color: var(--accent); }
th[aria-sort="ascending"] .sortbtn::after { content: "▲"; font-size: 8px; color: var(--accent); }
.pn { font-weight: 600; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.pmeta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.tag { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; border-radius: 4px; padding: 0 5px; border: 1px solid var(--line); color: var(--ink-2); line-height: 16px; }
.tag.st { color: var(--up); border-color: rgba(16, 185, 129, .45); }
.tag.q { color: var(--warn); border-color: rgba(245, 181, 68, .45); }
.tag.sit { color: var(--down); border-color: rgba(248, 113, 113, .5); }
.dl { font-size: 10.5px; margin-left: 3px; font-weight: 600; }
.dl.up { color: var(--up); } .dl.down { color: var(--down); }
.tfoot { padding: 8px 14px 10px; color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.t td.sitnote { text-align: left; white-space: normal; min-width: 220px; color: var(--muted); }
@media (max-width: 700px) {
  .t .rng, .t .run, .t th.rng, .t th.run { display: none; }
  .t .c-name { width: 136px; min-width: 136px; max-width: 136px; }
}

/* drilldown */
.dh { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.dh h2 { font-size: 18px; }
.dh .sub { color: var(--ink-2); font-size: 12.5px; }
.note { margin: 0; padding: 8px 10px; border-radius: 7px; background: var(--panel-2); color: var(--ink-2); font-size: 12.5px; border: 1px solid var(--line); }
.sb { padding: 12px 14px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.sb:last-child { border-bottom: 0; }
.sb-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sb-h h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.kpi { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; display: grid; gap: 1px; min-width: 0; }
.kpi .l { color: var(--muted); font-size: 11px; display: flex; align-items: center; white-space: nowrap; }
.kpi .v { font-size: 17px; font-weight: 650; }
.kpi.proj { background: var(--proj-band); border-color: rgba(230, 232, 236, .22); }
.kpi.avg { background: var(--avg-band); border-color: rgba(255, 90, 31, .45); }
.kpi.proj .v { font-size: 22px; }
.kpi.avg .v { font-size: 22px; color: var(--avg-ink); }
.kpi .d { font-size: 11px; color: var(--muted); }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
svg.chart text { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
.lineset { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12.5px; }
.lineset input[type=range] { flex: 1 1 120px; min-width: 100px; }
.lineval { min-width: 3ch; text-align: center; font-weight: 700; color: var(--ink); }
.sbar { display: flex; gap: 2px; height: 28px; }
.sbar > div { border-radius: 4px; display: flex; align-items: center; padding: 0 8px; font-size: 12px; font-weight: 700; color: #0D0E12; min-width: 0; overflow: hidden; white-space: nowrap; }
.sbar .a { background: var(--at); } .sbar .b { background: var(--below); }
.cap { color: var(--ink-2); font-size: 12.5px; }
.cap b { color: var(--ink); }
.spark-h { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 10px; color: var(--muted); font-size: 12px; }

/* tooltip */
.tip { position: fixed; z-index: 50; pointer-events: none; display: none; background: #1B1F27; border: 1px solid var(--line);
  border-radius: 7px; padding: 6px 9px; font-size: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, .45); max-width: 240px; }
.tip .t1 { font-family: var(--mono); font-weight: 700; color: var(--ink); }
.tip .t2 { color: var(--ink-2); }

/* notes */
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.card { padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.card h2 { font-size: 14px; }
.card p, .card li { margin: 0; color: var(--ink-2); font-size: 13px; }
.card ol, .card ul { margin: 0; padding-left: 1.2em; display: grid; gap: 5px; }
table.mini { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.mini th, .mini td { padding: 5px 6px; border-top: 1px solid var(--line-soft); text-align: right; white-space: nowrap; }
.mini th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
.mini th:first-child, .mini td:first-child { text-align: left; white-space: normal; }
.mini td { font-family: var(--mono); color: var(--ink); }
.mini td:first-child { font-family: var(--sans); color: var(--ink-2); }
code { font-family: var(--mono); font-size: .9em; background: var(--panel-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; word-break: break-word; }
footer { color: var(--muted); font-size: 12px; display: grid; gap: 4px; }
@media (prefers-reduced-motion: no-preference) { .gchip, .seg button, .step { transition: background-color .12s, border-color .12s; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>NBA Projections</h1><span class="sub" id="sub">Simulation</span></div>
    <div class="meta" id="meta"></div>
  </header>

  <nav class="slate" id="slate" aria-label="Games"></nav>

  <section class="panel" id="gamepanel" aria-label="Game and injury report">
    <div class="ph"><h2 id="gtitle"></h2><span class="aside" id="gmeta"></span></div>
    <div class="inj" id="injuries"></div>
  </section>

  <div class="toolbar" role="group" aria-label="Table filters">
    <div class="seg" id="teamseg" role="group" aria-label="Team"></div>
    <label class="ctl">Min ≥ <input type="range" id="minmin" min="0" max="36" step="1" value="0" aria-describedby="minval"><span class="val num" id="minval">0</span></label>
    <div class="ctl" role="group" aria-label="Run">
      <button type="button" class="step" id="prev" aria-label="Previous run">‹</button>
      <span class="num" id="runlabel" aria-live="polite"></span>
      <button type="button" class="step" id="next" aria-label="Next run">›</button>
      <input type="range" id="runrange" min="1" max="1" value="1" aria-label="Run number">
    </div>
    <div class="legend">
      <span><span class="key" style="background:var(--proj)"></span>Proj: model projection</span>
      <span><span class="key" style="background:var(--avg)"></span>Avg: average of all runs</span>
      <span><span class="key" style="background:var(--run)"></span>one run</span>
    </div>
  </div>

  <main class="split">
    <section class="panel" aria-label="Players">
      <div class="tscroll"><table class="t" id="table"></table></div>
      <div class="tfoot" id="tfoot"></div>
    </section>
    <aside class="panel drill" id="drill" aria-label="Player details"></aside>
  </main>

  <section class="notes" id="notes"></section>
  <footer id="footer"></footer>
</div>

    svg.append(hit);

    g.append(sv("line", { x1: x, x2: x, y1: top - 4, y2: base, stroke: color, "stroke-width": 2, "stroke-linecap": "round" }));

          row("Rebounds off by (avg)", g0.reb.mae.toFixed(2), g1.reb.mae.toFixed(2)),
          row("Assists off by (avg)", g0.ast.mae.toFixed(2), g1.ast.mae.toFixed(2))))),
      el("p", { text: "Giving teammates all of the missing minutes made forecasts worse, so only a share is used. How often questionable players end up playing is not measured yet (no free history of injury reports), so you choose plays or sits." })));
  }

  const ch = el("table", { class: "mini" }, el("thead", {}, el("tr", {}, el("th", { text: "Games checked" }), el("th", { text: "Stat" }), el("th", { text: "Inside middle 80%" }), el("th", { text: "Avg run vs real" }))));
  const tb = el("tbody");
  for (const [key, label] of [["test_months", "Last season, Feb–Apr"], ["deployed_model_recent_games", "This season, today's model"]]) {
    const c = DATA.checks[key];
    if (!c) continue;
    STATS.forEach((s, i) => tb.append(el("tr", {},
      el("td", { text: i === 0 ? `${label} (${c.n_games.toLocaleString()})` : "" }), el("td", { text: SHORT[s] }),
      el("td", { text: pct(c[s].coverage_10_90) }), el("td", { text: signed(c[s].mean_sim_minus_actual, 2) }))));
  }
  ch.append(tb);
  cards.push(el("div", { class: "panel card" }, el("h2", { text: "Checked before use" }),
    el("p", { text: "Simulated outcomes were compared with real results on games the error record never saw. About 80% of real results should land inside the middle 80% of runs (a few points more for whole-number stats like assists), and the average run should land on the real result." }),
    el("div", { class: "tscroll" }, ch)));

  const gaps = { pts: [], reb: [], ast: [] };
  DATA.games.forEach((g) => g.players.forEach((p) => STATS.forEach((s) => gaps[s].push(Math.abs(summarize(p.runs[s]).avg - p.proj[s])))));
  const q90 = (a) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.min(s.length - 1, Math.floor(0.9 * s.length))] : 0; };
  cards.push(el("div", { class: "panel card" }, el("h2", { text: "What the runs leave out" }),
    el("ul", {}, ...DATA.not_modelled.map((t) => el("li", { text: t }))),
    gaps.pts.length ? el("p", { text: `With ${DATA.runs} runs, the average of the runs drifts a little from the projection: for 9 in 10 players here by ${f1(q90(gaps.pts))} points or less (${f1(q90(gaps.reb))} rebounds, ${f1(q90(gaps.ast))} assists). More runs make the gap smaller. The projection is the better single number; the runs show the spread.` }) : null));
  $("notes").replaceChildren(...cards);

  const created = new Date(DATA.created_at);
  $("footer").replaceChildren(
    el("div", { text: `Generated ${created.toLocaleString("en-US", { timeZone: "America/New_York", dateStyle: "medium", timeStyle: "short" })} ET with seed ${DATA.seed}, using the projections the app had at that time. Not betting advice.` }),
    el("div", {}, "Run it again from the project folder: ", el("code", { text: `powershell -ExecutionPolicy Bypass -File scripts\\simulate.ps1 -Date ${DATA.date} -Runs ${DATA.runs}` }),
      " (on a Mac: ", el("code", { text: `bash scripts/simulate.sh --date ${DATA.date} --runs ${DATA.runs}` }), ")"));
}

/* ------------------------------------------------------------------ wiring */
function render() {
  const g = game();
  renderSlate();
  if (!g) {
    $("gtitle").textContent = "No games were simulated for this day.";
    return;
  }
  renderGame(g);
  renderToolbar(g);
  const rows = rowsFor(g);
  renderTable(g, rows);
  renderDrill(g);
}
$("minmin").addEventListener("input", (e) => { state.minMin = Number(e.target.value); save(); render(); });
$("prev").addEventListener("click", () => { state.run = state.run > 1 ? state.run - 1 : DATA.runs; render(); });
$("next").addEventListener("click", () => { state.run = state.run < DATA.runs ? state.run + 1 : 1; render(); });
$("runrange").addEventListener("input", (e) => { state.run = Number(e.target.value); render(); });
window.addEventListener("scroll", hideTip, { passive: true });
renderHeader();
render();
renderNotes();
</script>
</body>
</html>
